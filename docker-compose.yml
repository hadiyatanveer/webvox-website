# webvox-bot/docker-compose.yml
services:
  mongodb:
    image: mongo:latest
    container_name: webvox_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: webvox_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - webvox_network

  mongo-express:
    image: mongo-express:latest
    container_name: webvox_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false" # Disables basic auth for local dev UI
    depends_on:
      - mongodb
    networks:
      - webvox_network

volumes:
  mongo_data:
  mongo_config:

networks:
  webvox_network:
    driver: bridge